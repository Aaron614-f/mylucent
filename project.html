<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Project — myLucent.co</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Spectral:wght@400;500;600&family=Inter:wght@300;400;500;600&display=swap');
  :root{
    --ivory:#F4F1EA; --white:#FFFFFF; --charcoal:#1B2733;
    --gold:#A9784F; --gold-soft:#C9A97D;
    --line: rgba(27,39,51,0.12); --muted: rgba(27,39,51,0.6);
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; background:var(--ivory); color:var(--charcoal); font-family:'Inter', sans-serif; }
  h1,h2,h3{ font-family:'Spectral', serif; margin:0; }
  a{ color:inherit; }
  img{ max-width:100%; display:block; }

  header{ display:flex; align-items:center; justify-content:space-between; padding:22px 44px; background:var(--charcoal); }
  .brand{ display:flex; align-items:center; }
  .brand-logo{ height:26px; width:94px; display:block; }
  nav{ display:flex; gap:28px; }
  nav a{ font-size:12px; letter-spacing:2px; text-decoration:none; color:var(--ivory); opacity:0.85; }
  nav a:hover{ opacity:1; color:var(--gold-soft); }

  .section-inner{ max-width:1000px; margin:0 auto; padding:56px 44px 90px; }
  @media (max-width: 760px){ .section-inner{ padding:40px 20px 60px; } }

  .back-link{ font-size:12px; letter-spacing:1px; color:var(--muted); text-decoration:none; display:inline-block; margin-bottom:28px; }
  .back-link:hover{ color:var(--gold); }

  .project-tag{ font-size:11px; letter-spacing:2.5px; color:var(--gold); text-transform:uppercase; }
  h1.project-title{ font-size:32px; font-weight:500; margin-top:10px; margin-bottom:36px; }

  .photo-grid{ display:grid; grid-template-columns:1fr 1fr; gap:22px; }
  @media (max-width: 700px){ .photo-grid{ grid-template-columns:1fr; } }
  .photo-grid img{
    width:100%; border-radius:14px;
    box-shadow: 0 20px 40px -26px rgba(27,39,51,0.3);
  }

  footer{ padding:40px 44px 28px; text-align:center; border-top:1px solid var(--line); background:var(--white); }
  .footer-inner{ display:flex; justify-content:center; gap:24px; margin-bottom:16px; }
  .footer-inner a{ font-size:11px; letter-spacing:1.5px; text-transform:uppercase; color:var(--charcoal); text-decoration:none; }
  .footer-inner a:hover{ color:var(--gold); }
  footer p{ font-size:11px; letter-spacing:1px; color:var(--muted); margin:0; }
</style>
<style id="std-nav">
  #site-header{background:#FFFFFF !important;border-radius:0 !important;padding:20px 32px !important;margin:0 !important;display:flex !important;align-items:center !important;justify-content:space-between !important;box-shadow:0 4px 14px -6px rgba(27,39,51,0.12) !important;position:sticky !important;top:0 !important;left:auto !important;right:auto !important;width:auto !important;max-width:none !important;z-index:50 !important;backdrop-filter:none !important;-webkit-backdrop-filter:none !important;border:none !important;transition:transform .3s ease,opacity .3s ease;}
  #site-header.hdr-hidden{transform:translateY(-140%);opacity:0;}
  #site-header > a{flex-shrink:0;display:block;}
  #site-header .desktop-nav{display:flex;gap:32px;}
  #site-header .nav-link{position:relative;color:#1B2733 !important;text-decoration:none;font-family:'Inter',sans-serif;font-size:12px;letter-spacing:1.5px;padding:6px 2px;white-space:nowrap;}
  #site-header .nav-link::after{content:'';position:absolute;left:0;right:100%;bottom:0;height:1px;background:#1B2733;transition:right .3s ease;}
  #site-header .nav-link:hover::after{right:0;}
  #site-header .mobile-menu-btn{display:none;background:none;border:none;cursor:pointer;padding:6px;flex-shrink:0;}
  #site-header .mobile-dropdown{display:none;position:absolute;top:calc(100% + 8px);left:12px;right:12px;background:#FFFFFF;border-radius:10px;box-shadow:0 10px 28px -8px rgba(27,39,51,0.28);padding:8px;flex-direction:column;gap:2px;z-index:60;}
  #site-header .mobile-dropdown.open{display:flex;}
  #site-header .mobile-dropdown a{padding:13px 14px;font-family:'Inter',sans-serif;font-size:12px;letter-spacing:1.5px;color:#1B2733;border-radius:6px;text-decoration:none;}
  #site-header .mobile-dropdown a:hover{background:rgba(169,120,79,0.08);}
  @media (max-width:820px){
    #site-header{padding:14px 16px !important;margin:0 !important;}
    #site-header .desktop-nav{display:none !important;}
    #site-header .mobile-menu-btn{display:flex;}
  }
</style>
</head>
<body>

  <header id="site-header">
  <a href="./index.html"><img src="logo.svg" alt="myLucent.co" style="height:26px;width:94px;display:block;"></a>
  <nav class="desktop-nav">
    <a href="./index.html#gallery" class="nav-link">GALLERY</a>
    <a href="./index.html#how" class="nav-link">HOW IT WORKS</a>
    <a href="./order.html" class="nav-link">ORDER PLAQUE</a>
    <a href="./contact.html" class="nav-link">CONTACT</a>
  </nav>
  <button class="mobile-menu-btn" id="mobileMenuBtn" aria-label="Menu">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1B2733" stroke-width="1.8"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
  </button>
  <div class="mobile-dropdown" id="mobileDropdown">
    <a href="./index.html#gallery">GALLERY</a>
    <a href="./index.html#how">HOW IT WORKS</a>
    <a href="./order.html">ORDER PLAQUE</a>
    <a href="./contact.html">CONTACT</a>
  </div>
</header>

  <div class="section-inner">
    <a class="back-link" href="gallery.html">← Back to Gallery</a>
    <div id="projectContent">
      <div class="project-tag">Loading…</div>
    </div>
  </div>

  <footer>
    <div class="footer-inner">
      <a href="index.html">Home</a>
      <a href="order.html">Order</a>
      <a href="gallery.html">Gallery</a>
      <a href="contact.html">Contact</a>
    </div>
    <p>© myLucent.co — Personalized Acrylic Art &amp; Silver Nameplates</p>
  </footer>

<script src="projects-data.js"></script>
<script>
  function getParam(name){
    var params = new URLSearchParams(window.location.search);
    return params.get(name);
  }

  var id = getParam('id');
  var project = (window.PROJECTS || []).find(function(p){ return p.id === id; });
  var container = document.getElementById('projectContent');

  if (!project){
    container.innerHTML = '<div class="project-tag">Not Found</div><h1 class="project-title">We couldn\'t find that project.</h1>';
  } else {
    var html = '<div class="project-tag">' + project.tag + '</div>';
    html += '<h1 class="project-title">' + project.title + '</h1>';
    html += '<div class="photo-grid">';
    project.photos.forEach(function(src){
      html += '<img src="' + src + '" alt="' + project.title + '">';
    });
    html += '</div>';
    container.innerHTML = html;
    document.title = project.title + ' — myLucent.co';
  }
</script>
<script id="std-nav-js">
(function(){
  var btn=document.getElementById('mobileMenuBtn'),dd=document.getElementById('mobileDropdown'),h=document.getElementById('site-header');
  if(btn&&dd){
    btn.addEventListener('click',function(e){e.stopPropagation();dd.classList.toggle('open');});
    document.addEventListener('click',function(e){if(!dd.contains(e.target)&&!btn.contains(e.target))dd.classList.remove('open');});
  }
  if(h){var last=window.scrollY;window.addEventListener('scroll',function(){var y=window.scrollY;h.classList.toggle('hdr-hidden',y>last&&y>80);last=y;},{passive:true});}
})();
</script>
</body>
</html>
