<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>myLucent — Inbox</title>
<meta name="robots" content="noindex, nofollow">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Spectral:wght@400;500;600&family=Inter:wght@300;400;500;600&display=swap');
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:#FFFFFF;color:#1B2733;font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;}
  a{color:inherit;text-decoration:none;}
  input,textarea,button{font-family:'Inter',sans-serif;color:#1B2733;}
  input:focus,textarea:focus{outline:none;}
  button:focus-visible,input:focus-visible,textarea:focus-visible{outline:1px solid #A9784F;outline-offset:2px;}
  ::placeholder{color:rgba(27,39,51,0.38);}
  button{cursor:pointer;}

  /* shared bits */
  .tb{background:none;border:none;padding:6px 0;font-size:11px;letter-spacing:1.5px;white-space:nowrap;border-bottom:1px solid transparent;}
  .tb:hover{border-bottom-color:#1B2733;}
  .tb.mute{color:rgba(27,39,51,0.5);} .tb.mute:hover{color:#1B2733;border-bottom-color:transparent;}
  .tb.danger{color:rgba(27,39,51,0.45);} .tb.danger:hover{color:#b23b3b;border-bottom-color:transparent;}
  .mini{background:none;border:none;padding:4px 0;display:flex;align-items:center;gap:7px;font-size:12px;color:rgba(27,39,51,0.7);}
  .mini:hover{color:#1B2733;}
  .cta{background:#1B2733;color:#F4F1EA;border:none;padding:14px 26px;font-size:11px;letter-spacing:2px;display:flex;gap:14px;align-items:center;transition:background .3s;}
  .cta:hover{background:#A9784F;}
  .cta:disabled{opacity:.6;cursor:default;}
  .ghost{background:none;border:1px solid #1B2733;color:#1B2733;padding:10px 16px;font-size:11px;letter-spacing:1.5px;white-space:nowrap;display:flex;align-items:center;gap:10px;transition:background .25s,color .25s;}
  .ghost:hover{background:#1B2733;color:#F4F1EA;}
  .link{background:none;border:none;padding:4px 0;font-size:10.5px;letter-spacing:1.8px;white-space:nowrap;color:#1B2733;}
  .link:hover{color:#A9784F;}
  .x{background:none;border:none;color:rgba(27,39,51,0.3);font-size:15px;padding:0;}
  .x:hover{color:#1B2733;}
  .ul{border:none;border-bottom:1px solid rgba(27,39,51,0.2);padding:8px 0;font-size:13px;background:transparent;min-width:0;width:100%;}
  .cell{border:none;padding:12px 0;font-size:13px;background:transparent;min-width:0;width:100%;}
  .eyebrow{font-size:10px;letter-spacing:2px;color:rgba(27,39,51,0.45);}
  .empty{padding:80px 0;font-size:13.5px;color:rgba(27,39,51,0.45);}
  .tabbtn{background:none;border:none;padding:0 0 8px;font-size:11px;letter-spacing:2px;white-space:nowrap;display:flex;align-items:center;gap:8px;}
  .filt{background:none;border:none;padding:4px 0;font-size:10.5px;letter-spacing:1.8px;white-space:nowrap;}
  .conv{width:100%;text-align:left;border:none;border-bottom:1px solid rgba(27,39,51,0.08);padding:18px 28px;display:flex;gap:14px;align-items:flex-start;transition:background .2s;}
  .conv:hover{background:#F4F1EA;}
  .tile{background:none;border:none;padding:0;text-align:left;display:flex;flex-direction:column;gap:8px;min-width:0;transition:opacity .2s;}
  .tile:hover{opacity:.75;}
  .thumb{background-size:cover;background-position:center;background-repeat:no-repeat;}
  .sec{display:flex;flex-direction:column;gap:16px;border-top:2px solid #1B2733;padding-top:18px;}
  .sec h3{font-family:'Spectral',serif;font-weight:500;font-size:22px;margin:0;}
  .stat{display:flex;flex-direction:column;gap:6px;min-width:0;}
  .stat .v{font-family:'Spectral',serif;font-size:19px;white-space:nowrap;}
  .vnav{width:44px;height:44px;flex-shrink:0;border-radius:50%;border:1px solid rgba(244,241,234,0.35);background:none;color:#F4F1EA;font-size:16px;transition:background .25s,color .25s;}
  .vnav:hover{background:#F4F1EA;color:#1B2733;}
  .vbtn{background:none;border:none;color:rgba(244,241,234,0.75);font-size:10.5px;letter-spacing:1.8px;padding:4px 0;}
  .vbtn:hover{color:#C9A97D;}
  @media (max-width:820px){
    header.top{padding:16px 18px !important;}
    main.mainpane{padding:26px 20px 56px !important;}
    aside.sidebar{border-right:none !important;border-bottom:1px solid rgba(27,39,51,0.1);}
  }
</style>
</head>
<body>

<!-- ===================== LOGIN ===================== -->
<div id="loginScreen" style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;">
  <div style="width:100%;max-width:340px;display:flex;flex-direction:column;gap:28px;">
    <img src="logo.svg" alt="myLucent.co" style="height:26px;width:94px;display:block;">
    <div>
      <div style="font-size:11px;letter-spacing:3px;color:#A9784F;margin-bottom:10px;">ADMIN</div>
      <h1 style="font-family:'Spectral',serif;font-weight:500;font-size:30px;line-height:1.2;margin:0;">Inbox</h1>
    </div>
    <div id="loginError" style="font-size:12.5px;color:#b23b3b;display:none;">Incorrect key. Try again.</div>
    <input id="keyInput" type="password" placeholder="Admin key" autocomplete="off" style="width:100%;border:none;border-bottom:1px solid rgba(27,39,51,0.25);padding:10px 0;font-size:15px;background:transparent;">
    <button id="loginBtn" class="cta" style="align-self:flex-start;">ENTER <span>→</span></button>
  </div>
</div>

<!-- ===================== INBOX ===================== -->
<div id="inboxScreen" style="display:none;min-height:100vh;flex-direction:column;">

  <header class="top" style="display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap;padding:20px 32px;border-bottom:1px solid rgba(27,39,51,0.1);">
    <div style="display:flex;align-items:center;gap:20px;">
      <img src="logo.svg" alt="myLucent.co" style="height:26px;width:94px;display:block;">
      <div style="width:1px;height:18px;background:rgba(27,39,51,0.2);"></div>
      <div id="screenNav" style="display:flex;gap:26px;"></div>
    </div>
    <div style="display:flex;align-items:center;gap:8px 20px;flex-wrap:wrap;justify-content:flex-end;">
      <span id="backupMsg" style="font-size:11.5px;color:#A9784F;"></span>
      <button class="tb" id="downloadBackupBtn">DOWNLOAD BACKUP</button>
      <button class="tb" id="restoreBackupBtn">RESTORE</button>
      <input type="file" id="restoreFileInput" accept=".json,application/json" style="display:none;">
      <button class="tb mute" id="lockBtn">LOCK</button>
    </div>
  </header>

  <div id="inboxCols" style="flex:1;display:flex;flex-wrap:wrap;width:100%;max-width:1240px;margin:0 auto;">
    <aside class="sidebar" style="flex:1 1 300px;max-width:100%;min-width:0;border-right:1px solid rgba(27,39,51,0.1);display:flex;flex-direction:column;">
      <div style="padding:32px 28px 20px;display:flex;flex-direction:column;gap:22px;">
        <div style="display:flex;align-items:baseline;justify-content:space-between;">
          <h2 style="font-family:'Spectral',serif;font-weight:500;font-size:24px;margin:0;">Messages</h2>
          <span id="unreadBadge" style="font-size:10.5px;letter-spacing:1.5px;color:#A9784F;white-space:nowrap;display:none;"></span>
        </div>
        <div style="display:flex;align-items:center;gap:10px;border-bottom:1px solid rgba(27,39,51,0.2);padding-bottom:8px;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="rgba(27,39,51,0.45)" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
          <input id="searchBox" placeholder="Search" style="flex:1;min-width:0;border:none;background:transparent;font-size:13px;padding:2px 0;">
        </div>
      </div>
      <div id="msgList" style="display:flex;flex-direction:column;border-top:1px solid rgba(27,39,51,0.1);overflow-y:auto;"></div>
    </aside>
    <main id="mainPane" class="mainpane" style="flex:999 1 480px;min-width:0;padding:40px 48px 64px;"></main>
  </div>
</div>

<div id="viewerRoot"></div>
<input type="file" id="replyFileInput" multiple style="display:none;">
<input type="file" id="folderFileInput" multiple style="display:none;">

<script>
(function(){
  'use strict';

  var KEY = 'mylucent_admin_key';
  var TIMER_KEY = 'mylucent_timer';
  var INK = '#1B2733', MUTE = 'rgba(27,39,51,0.45)';

  var S = {
    convos: [], active: null, view: 'convo', search: '', sig: '',
    replyText: '', files: [], prePolish: null, polishing: false, polishMsg: '', listening: false,
    invoiceOpen: false, docType: 'invoice', billTo: '', orderDesc: '', address: '', dueDate: '', taxRate: '', rows: [],
    error: '', sentFlash: false, sending: false,
    fileFilter: 'all', viewer: null,
    expDesc: '', expAmt: '', timeTask: '', timeDur: '', manualOpen: false, manTask: '',
    editingName: false, nameDraft: '', timer: null, now: Date.now(), folderMsg: '', screen: 'inbox', reattach: []
  };
  var rowSeq = 0;
  var blobCache = {};

  function $(id){ return document.getElementById(id); }
  function esc(s){ return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
  function getKey(){ try { return sessionStorage.getItem(KEY) || ''; } catch(e){ return ''; } }
  function setKey(k){ try { sessionStorage.setItem(KEY, k); } catch(e){} }
  function clearKey(){ try { sessionStorage.removeItem(KEY); } catch(e){} }

  function apiFetch(url, options){
    options = options || {};
    options.headers = options.headers || {};
    options.headers['X-Admin-Key'] = getKey();
    return fetch(url, options);
  }
  function postJson(url, body){
    return apiFetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) })
      .then(function(r){ return r.json().catch(function(){ return {}; }).then(function(d){ d._ok = r.ok; return d; }); });
  }

  /* ---------- formatting ---------- */
  function fmtTime(ts){
    var d = new Date(ts), now = new Date();
    if (d.toDateString() === now.toDateString()) return d.toLocaleTimeString('en-AU', { hour: 'numeric', minute: '2-digit' });
    return d.toLocaleDateString('en-AU', { day: 'numeric', month: 'short' });
  }
  function day(ts){ return new Date(ts).toLocaleDateString('en-AU', { day: 'numeric', month: 'short' }); }
  function money(v){ return '$' + Number(v).toLocaleString('en-AU', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
  function fmtDur(m){ m = Math.round(m); var hh = Math.floor(m / 60), r = m % 60; return hh ? hh + 'h' + (r ? ' ' + r + 'm' : '') : r + 'm'; }
  function parseDur(v){
    v = (v || '').trim().toLowerCase(); if (!v) return 0;
    var hm = v.match(/(\d+(?:\.\d+)?)\s*h/), mm = v.match(/(\d+)\s*m/);
    if (hm || mm) return Math.round((hm ? parseFloat(hm[1]) * 60 : 0) + (mm ? parseInt(mm[1], 10) : 0));
    var x = parseFloat(v); return isNaN(x) ? 0 : Math.round(x);
  }
  function initials(name){ var p = String(name || '').trim().split(/\s+/); return ((p[0] || '')[0] || '').toUpperCase() + ((p[1] || '')[0] || '').toUpperCase(); }
  function active(){ return S.convos.filter(function(c){ return c.reference === S.active; })[0] || null; }
  function byRef(ref){ return S.convos.filter(function(c){ return c.reference === ref; })[0] || null; }

  var ICON_FOLDER = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"></path></svg>';
  var ICON_DOC = '<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#1B2733" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><path d="M14 2v6h6M8 13h8M8 17h5"></path></svg>';

  /* ---------- files ---------- */
  function extOf(name){ var m = /\.([a-z0-9]+)$/i.exec(name || ''); return m ? m[1].toLowerCase() : ''; }
  function kindOf(f){
    var e = extOf(f.name);
    if (['jpg','jpeg','png','gif','webp'].indexOf(e) !== -1) return 'image';
    if (e === 'pdf') return 'pdf';
    return 'other';
  }
  function blobType(f){
    var k = kindOf(f), e = extOf(f.name);
    if (k === 'image') return 'image/' + (e === 'jpg' ? 'jpeg' : e);
    if (k === 'pdf') return 'application/pdf';
    return 'application/octet-stream';
  }
  function fileLabel(f){
    if (f.docType === 'quote') return 'QUOTE';
    if (f.docType === 'invoice') return 'INVOICE';
    return (extOf(f.name) || 'file').toUpperCase().slice(0, 5);
  }
  function folderFiles(c){
    return (c.files || []).slice().sort(function(a, b){ return a.at - b.at; });
  }
  // Fetches a stored file (with the admin key) and returns a blob: URL whose
  // type is forced from the file extension, so a customer's file can never
  // be treated as a web page.
  function fileUrl(c, f){
    var k = c.reference + '/' + f.id;
    if (!blobCache[k]){
      blobCache[k] = apiFetch('/api/inbox/file/' + encodeURIComponent(c.reference) + '/' + encodeURIComponent(f.id))
        .then(function(r){ if (!r.ok) throw new Error('missing'); return r.blob(); })
        .then(function(b){ return URL.createObjectURL(new Blob([b], { type: blobType(f) })); });
      blobCache[k].catch(function(){ delete blobCache[k]; });
    }
    return blobCache[k];
  }
  function hydrateThumbs(root){
    var c = active(); if (!c) return;
    var files = {}; (c.files || []).forEach(function(f){ files[f.id] = f; });
    Array.prototype.forEach.call((root || document).querySelectorAll('[data-thumb]'), function(el){
      var f = files[el.getAttribute('data-thumb')]; if (!f) return;
      fileUrl(c, f).then(function(u){ el.style.backgroundImage = 'url("' + u + '")'; }).catch(function(){});
    });
  }

  /* ---------- folder numbers ---------- */
  function latestQuote(c){
    var q = folderFiles(c).filter(function(f){ return f.docType === 'quote' && typeof f.total === 'number'; });
    return q.length ? q[q.length - 1] : null;
  }
  function figures(c){
    var fo = c.folder; if (!fo) return null;
    var exp = fo.expenses.reduce(function(t, e){ return t + e.amount; }, 0);
    var mins = fo.time.reduce(function(t, e){ return t + e.min; }, 0);
    var lq = latestQuote(c);
    var quoted = fo.quoted != null ? fo.quoted : (lq ? lq.total : null);
    return {
      exp: exp, mins: mins, quoted: quoted, lq: lq,
      days: Math.max(1, Math.ceil((Date.now() - fo.startedAt) / 86400000)),
      net: quoted != null ? quoted - exp : null,
      rate: (quoted != null && mins > 0) ? (quoted - exp) / (mins / 60) : null
    };
  }


  /* ---------- payments ---------- */
  var DAY = 86400000;
  function pays(c){ return (c.folder && c.folder.payments) || []; }
  function isOverdue(p){ return !p.paid && Date.now() > p.dueAt; }
  function daysAgo(ts){
    var d = Math.floor((Date.now() - ts) / DAY);
    return d <= 0 ? 'today' : d === 1 ? '1 day ago' : d + ' days ago';
  }
  function dueText(p){
    if (p.paid) return 'Paid ' + day(p.paidAt);
    if (Date.now() > p.dueAt){
      var d = Math.floor((Date.now() - p.dueAt) / DAY);
      return 'Overdue' + (d >= 1 ? ' by ' + d + (d === 1 ? ' day' : ' days') : '');
    }
    var left = Math.ceil((p.dueAt - Date.now()) / DAY);
    return left <= 0 ? 'Due today' : 'Due in ' + left + (left === 1 ? ' day' : ' days');
  }
  function dateInputVal(ts){
    var d = new Date(ts), m = String(d.getMonth() + 1).padStart(2, '0'), dd = String(d.getDate()).padStart(2, '0');
    return d.getFullYear() + '-' + m + '-' + dd;
  }
  function endOfDay(v){ // 'YYYY-MM-DD' -> end of that day, local time
    var a = String(v).split('-'); if (a.length !== 3) return 0;
    return new Date(+a[0], +a[1] - 1, +a[2], 23, 59, 59).getTime();
  }
  function allPayments(){
    var list = [];
    S.convos.forEach(function(c){ pays(c).forEach(function(p){ list.push({ c: c, p: p }); }); });
    return list;
  }
  function overdueCount(){ return allPayments().filter(function(o){ return isOverdue(o.p); }).length; }
  function reminderText(c, p){
    var first = String(c.name || '').trim().split(/\s+/)[0] || 'there';
    var when = Date.now() > p.dueAt ? 'was due on ' + new Date(p.dueAt).toLocaleDateString('en-AU', { day: 'numeric', month: 'long' }) + ' and is still awaiting payment'
      : 'is due on ' + new Date(p.dueAt).toLocaleDateString('en-AU', { day: 'numeric', month: 'long' });
    return 'Hi ' + first + ',\n\nJust a friendly reminder that invoice ' + p.number + ' for ' + money(p.total) + ' ' + when + '. I\'ve attached it again for your convenience.\n\nPlease let me know once it\'s been paid, or if you have any questions.\n\nThank you!';
  }

  /* ---------- timer (survives a refresh) ---------- */
  try { var tm = JSON.parse(localStorage.getItem(TIMER_KEY) || 'null'); if (tm && tm.ref && tm.start) S.timer = tm; } catch(e){}
  function saveTimer(){ try { if (S.timer) localStorage.setItem(TIMER_KEY, JSON.stringify(S.timer)); else localStorage.removeItem(TIMER_KEY); } catch(e){} }
  function clockText(){
    var el = S.timer ? Math.max(0, Math.floor((Date.now() - S.timer.start) / 1000)) : 0;
    function p(x){ return String(x).padStart(2, '0'); }
    return Math.floor(el / 3600) + ':' + p(Math.floor(el / 60) % 60) + ':' + p(el % 60);
  }
  setInterval(function(){ var e = $('timerClock'); if (e) e.textContent = clockText(); }, 1000);

  /* ---------- login ---------- */
  function tryLogin(key){
    setKey(key);
    loadMessages(function(ok){
      if (ok){ $('loginScreen').style.display = 'none'; $('inboxScreen').style.display = 'flex'; }
      else { clearKey(); $('loginError').style.display = 'block'; }
    });
  }
  $('loginBtn').addEventListener('click', function(){
    $('loginError').style.display = 'none';
    var k = $('keyInput').value.trim(); if (k) tryLogin(k);
  });
  $('keyInput').addEventListener('keydown', function(e){ if (e.key === 'Enter') $('loginBtn').click(); });
  $('lockBtn').addEventListener('click', function(){
    clearKey(); S.active = null; S.convos = [];
    $('inboxScreen').style.display = 'none'; $('loginScreen').style.display = 'flex'; $('keyInput').value = '';
  });

  /* ---------- loading ---------- */
  function sigOf(c){
    return c ? [c.messages.length, c.replies.length, c.status, c.textMode ? 1 : 0, (c.files || []).length, JSON.stringify(c.folder || null), JSON.stringify(c.showcase || null), c.name].join('|') : '';
  }
  function loadMessages(cb, silent){
    apiFetch('/api/inbox/messages')
      .then(function(r){ return r.json().then(function(d){ return { ok: r.ok, data: d }; }); })
      .then(function(res){
        if (!res.ok){ if (cb) cb(false); return; }
        S.convos = res.data.messages;
        var cur = active();
        var now = sigOf(cur), before = S.sig;
        S.sig = now;
        renderList();
        if (!silent){ renderMain(); }
        else if (cur && now !== before){
          var inConvo = S.view === 'convo' || !cur.folder;
          if (inConvo){
            var w = $('threadWrap'); if (w) w.innerHTML = threadHtml(cur);
            var tw = $('textModeWrap'); if (tw) tw.innerHTML = textModeInner(cur);
            var hd = $('headWrap'); if (hd && !S.editingName) hd.innerHTML = headInner(cur);
          } else {
            var ae = document.activeElement;
            var typing = ae && $('mainPane').contains(ae) && /^(INPUT|TEXTAREA)$/.test(ae.tagName);
            if (!typing) renderMain();
          }
        }
        if (cb) cb(true);
      })
      .catch(function(){ if (cb) cb(false); });
  }


  function renderNav(){
    $('screenNav').innerHTML = '<span style="font-size:11px;letter-spacing:2.5px;color:rgba(27,39,51,0.6);">INBOX</span>';
  }

  /* ---------- sidebar ---------- */
  function renderList(){
    var q = S.search.trim().toLowerCase();
    var unread = S.convos.filter(function(c){ return c.status === 'unread'; }).length;
    var badge = $('unreadBadge');
    badge.textContent = unread + ' NEW'; badge.style.display = unread ? 'inline' : 'none';
    var html = '';
    S.convos.forEach(function(c){
      var hay = (c.name + ' ' + c.email + ' ' + c.messages.map(function(m){ return m.text; }).join(' ')).toLowerCase();
      if (q && hay.indexOf(q) === -1) return;
      var isUnread = c.status === 'unread', isActive = c.reference === S.active;
      var last = c.messages[c.messages.length - 1];
      html += '<button class="conv" data-act="select" data-ref="' + esc(c.reference) + '" style="background:' + (isActive ? '#F4F1EA' : 'transparent') + ';opacity:' + (c.status === 'replied' && !isActive ? 0.6 : 1) + ';">' +
        '<span style="width:6px;height:6px;border-radius:50%;margin-top:7px;flex-shrink:0;background:' + (isUnread ? '#A9784F' : 'transparent') + ';"></span>' +
        '<span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:4px;">' +
          '<span style="display:flex;justify-content:space-between;gap:10px;">' +
            '<span style="font-size:14px;font-weight:' + (isUnread ? 600 : 400) + ';overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">' + esc(c.name) + (c.messages.length > 1 ? '<span style="font-weight:400;color:rgba(27,39,51,0.4);">  ' + c.messages.length + '</span>' : '') + '</span>' +
            '<span style="font-size:11px;color:rgba(27,39,51,0.45);flex-shrink:0;white-space:nowrap;">' + (c.status === 'replied' ? 'Replied' : fmtTime(c.lastActivityAt)) + '</span>' +
          '</span>' +

  /* ---------- conversation tab ---------- */

        S.rows.map(function(r){
          return '<div style="display:grid;grid-template-columns:minmax(0,1fr) 52px 84px 84px 20px;gap:12px;align-items:center;border-bottom:1px solid rgba(27,39,51,0.08);">' +
            '<input class="cell" placeholder="Description" data-row="' + r.id + '" data-k="desc" value="' + esc(r.desc) + '">' +

  /* PDFs: drawn with PDF.js so they show on phones too (a plain <iframe> shows
     nothing on many mobile browsers). Falls back to the browser's own viewer. */
  var pdfLibPromise = null;
  function loadPdfLib(){
    if (window.pdfjsLib) return Promise.resolve(window.pdfjsLib);
    if (!pdfLibPromise){
      pdfLibPromise = new Promise(function(resolve, reject){
        var sc = document.createElement('script');
        sc.src = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
        sc.onload = function(){
          if (!window.pdfjsLib) return reject(new Error('no lib'));
          window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
          resolve(window.pdfjsLib);
        };
        sc.onerror = function(){ pdfLibPromise = null; reject(new Error('load failed')); };
        document.head.appendChild(sc);
      });
    }
    return pdfLibPromise;
  }
  function showPdf(u, idx, put){
    function fallback(){ put('<iframe src="' + u + '" title="File preview" style="width:100%;max-width:760px;height:100%;border:none;background:#FFFFFF;"></iframe>'); }
    loadPdfLib().then(function(lib){
      return lib.getDocument({ url: u }).promise.then(function(pdf){
        if (S.viewer !== idx) return;
        put('<div id="pdfPages" style="width:100%;max-width:760px;height:100%;overflow:auto;background:#EDEAE2;display:flex;flex-direction:column;align-items:center;gap:12px;padding:12px 0;"></div>');
        var box = $('pdfPages'); if (!box) return;
        var width = Math.min(760, box.clientWidth || 760);
        var chain = Promise.resolve();
        for (var n = 1; n <= pdf.numPages; n++){
          (function(num){
            chain = chain.then(function(){
              if (S.viewer !== idx) return;
              return pdf.getPage(num).then(function(page){
                var base = page.getViewport({ scale: 1 });
                var scale = (width / base.width) * (window.devicePixelRatio || 1);
                var vp = page.getViewport({ scale: scale });
                var cv = document.createElement('canvas');
                cv.width = vp.width; cv.height = vp.height;
                cv.style.cssText = 'width:' + width + 'px;height:auto;background:#fff;flex-shrink:0;';
                var host = $('pdfPages'); if (!host) return;
                host.appendChild(cv);
                return page.render({ canvasContext: cv.getContext('2d'), viewport: vp }).promise;
              });
            });
          })(n);
        }
        return chain;
      });
    }).catch(fallback);
  }

  function currentViewerFile(){
    var c = active(); if (!c || S.viewer === null) return null;
    return folderFiles(c)[S.viewer] || null;
  }
  function moveViewer(d){
    var c = active(); if (!c) return; var n = folderFiles(c).length; if (!n) return;
    S.viewer = (S.viewer + d + n) % n; renderViewer();
  }
  document.addEventListener('keydown', function(e){
    if (S.viewer === null) return;
    if (e.key === 'Escape'){ S.viewer = null; renderViewer(); }
    if (e.key === 'ArrowRight') moveViewer(1);
    if (e.key === 'ArrowLeft') moveViewer(-1);
  });

  /* ---------- dictation ---------- */
  var recognition = null, micBase = '', micFinal = '';
  function applyMicUi(){
    var st = $('micStatus'), b = $('micBtn');
    if (st) st.style.display = S.listening ? 'flex' : 'none';
    if (b) b.style.color = S.listening ? '#b23b3b' : 'rgba(27,39,51,0.7)';
  }
  function toggleMic(){
    if (!SpeechCtor) return;
    if (S.listening){ try { recognition.stop(); } catch(e){} return; }
    var ta = $('replyText'); if (!ta) return;
    recognition = new SpeechCtor();
    recognition.continuous = true; recognition.interimResults = true; recognition.lang = 'en-AU';
    micBase = ta.value; if (micBase && !/\s$/.test(micBase)) micBase += ' ';
    micFinal = '';
    recognition.onstart = function(){ S.listening = true; applyMicUi(); };
    recognition.onend = function(){ S.listening = false; applyMicUi(); };
    recognition.onerror = function(){ S.listening = false; applyMicUi(); };
    recognition.onresult = function(e){
      var interim = '';
      for (var i = e.resultIndex; i < e.results.length; i++){
        var t = e.results[i][0].transcript;
        if (e.results[i].isFinal) micFinal += t + ' '; else interim += t;
      }
      var box = $('replyText');
      S.replyText = micBase + micFinal + interim;
      if (box) box.value = S.replyText;
    };
    try { recognition.start(); } catch(e){}
  }

  /* ---------- actions ---------- */
  function resetDrafts(){
    S.replyText = ''; S.files = []; S.prePolish = null; S.polishMsg = ''; S.invoiceOpen = false; S.docType = 'invoice';
    S.billTo = ''; S.orderDesc = ''; S.address = ''; S.dueDate = ''; S.taxRate = ''; S.rows = []; S.error = '';
    S.expDesc = ''; S.expAmt = ''; S.timeTask = ''; S.timeDur = ''; S.manualOpen = false; S.manTask = '';
    S.editingName = false; S.viewer = null; S.folderMsg = ''; S.fileFilter = 'all'; S.reattach = [];
    if (S.listening && recognition){ try { recognition.stop(); } catch(e){} }
  }
  function newRow(){ return { id: ++rowSeq, desc: '', qty: '1', price: '' }; }

  function collectInvoice(c){
    if (!S.invoiceOpen) return null;
    var items = [];
    S.rows.forEach(function(r){
      var d = r.desc.trim();
      if (d) items.push({ description: d, qty: parseFloat(r.qty) || 0, unitPrice: parseFloat(r.price) || 0 });
    });
    if (!items.length) return null;
    return {
      billToName: (S.billTo || '').trim() || c.name, billToAddress: (S.address || '').trim(), orderDescription: (S.orderDesc || '').trim(),
      docType: S.docType, dueDate: (S.docType === 'quote' || !S.dueDate) ? '' : new Date(endOfDay(S.dueDate)).toLocaleDateString('en-AU', { day: 'numeric', month: 'short', year: 'numeric' }), dueAtMs: (S.docType === 'quote' || !S.dueDate) ? 0 : endOfDay(S.dueDate), taxRate: parseFloat(S.taxRate) || 0, items: items
    };
  }

  function addFolderTime(ref, task, min){
    return postJson('/api/inbox/folder/time', { reference: ref, task: task, min: min }).then(function(d){
      if (!d.success){ S.folderMsg = d.error || 'Could not save that.'; renderMain(); return false; }
      var c = byRef(ref); if (c && c.folder) c.folder.time.push(d.entry);
      S.sig = sigOf(active()); renderList(); renderMain(); return true;
    });
  }

  function setPaid(t, paid){
    var ref = t.getAttribute('data-ref'), id = t.getAttribute('data-id'), c = byRef(ref); if (!c) return;
    postJson('/api/inbox/folder/payment/paid', { reference: ref, id: id, paid: paid }).then(function(d){
      if (!d.success) return;
      c.folder.payments = pays(c).map(function(x){ return x.id === id ? d.payment : x; });
      S.sig = sigOf(active()); renderList();
      renderMain();
    });
  }

  var ACT = {

    removeReattach: function(t){ var f = t.getAttribute('data-fid'); S.reattach = S.reattach.filter(function(x){ return x !== f; }); renderChips(); },
    markPaid: function(t){ setPaid(t, true); },
    undoPaid: function(t){ setPaid(t, false); },
    remind: function(t){
      var ref = t.getAttribute('data-ref'), id = t.getAttribute('data-id');
      var c = byRef(ref); if (!c) return;
      var p = pays(c).filter(function(x){ return x.id === id; })[0]; if (!p) return;
      S.active = ref; S.view = 'convo'; resetDrafts();
      if (!p.paid){
        S.replyText = reminderText(c, p);
        S.reattach = p.fileId ? [p.fileId] : [];
      }
      S.sig = sigOf(c);
      window.scrollTo(0, 0);
      renderList(); renderMain();
      var ta = $('replyText'); if (ta && !p.paid){ ta.focus(); ta.scrollIntoView({ block: 'center' }); }
    },
    select: function(t){
      var ref = t.getAttribute('data-ref');
      S.active = ref; S.view = 'convo'; resetDrafts();
      var c = active();
      if (c && c.status === 'unread'){
        postJson('/api/inbox/mark-read', { reference: ref }).then(function(){ var cc = byRef(ref); if (cc && cc.status === 'unread') cc.status = 'read'; S.sig = sigOf(active()); renderList(); });
        c.status = 'read';
      }
      S.sig = sigOf(c); renderList(); renderMain();
      window.scrollTo(0, 0);
    },
    editName: function(){ var c = active(); if (!c) return; S.editingName = true; S.nameDraft = c.name; $('headWrap').innerHTML = headInner(c); var ni = $('nameInput'); if (ni){ ni.focus(); ni.select(); } },
    cancelName: function(){ S.editingName = false; var c = active(); if (c) $('headWrap').innerHTML = headInner(c); },
    saveName: function(){
      var c = active(), v = (S.nameDraft || '').trim(); if (!c) return;
      if (!v){ ACT.cancelName(); return; }
      postJson('/api/inbox/rename', { reference: c.reference, name: v }).then(function(d){
        S.editingName = false;
        if (d.success){ c.name = v; S.sig = sigOf(c); renderList(); renderMain(); } else { renderMain(); }
      });
    },
    deleteConvo: function(){
      var c = active(); if (!c) return;
      if (!confirm('Delete this conversation with ' + c.name + '?' + (c.folder ? ' Its work folder and files will be deleted too.' : '') + ' This can\'t be undone.')) return;
      postJson('/api/inbox/delete', { reference: c.reference }).then(function(d){
        if (!d.success) return;
        S.convos = S.convos.filter(function(x){ return x.reference !== c.reference; });
        S.active = null; renderList(); renderMain();
      });
    },
    createFolder: function(){
      var c = active(); if (!c) return;
      postJson('/api/inbox/folder/create', { reference: c.reference }).then(function(d){
        if (!d.success) return;
        c.folder = d.folder; S.view = 'folder'; S.sig = sigOf(c); renderList(); renderMain();
      });
    },
    tabConvo: function(){ S.view = 'convo'; renderMain(); },
    tabFolder: function(){ S.view = 'folder'; renderMain(); },
    tabSite: function(){ S.view = 'site'; S.siteMsg = ''; renderMain(); },
    scShow: function(){ var c = active(); if (!c) return; var sc = c.showcase || {}; saveSite(c, { show: !sc.show }); },
    scCover: function(t){ var c = active(); if (c) saveSite(c, { coverId: t.getAttribute('data-id') }); },
    scHero: function(t){ var c = active(); if (!c) return; var id = t.getAttribute('data-id'); saveSite(c, { heroId: (c.showcase || {}).heroId === id ? null : id }); },
    scPhoto: function(t){
      var c = active(); if (!c) return; var sc = c.showcase || {}, id = t.getAttribute('data-id'), list = (sc.photoIds || []).slice();
      var i = list.indexOf(id);
      if (i === -1) list.push(id); else list.splice(i, 1);
      var patch = { photoIds: list }; if (i !== -1 && sc.coverId === id) patch.coverId = null;
      saveSite(c, patch);
    },

    /* reply tools */
    pickFiles: function(){ $('replyFileInput').click(); },
    removeFile: function(t){ S.files.splice(parseInt(t.getAttribute('data-i'), 10), 1); renderChips(); },
    toggleMic: toggleMic,
    polish: function(){
      var ta = $('replyText'); var text = ta ? ta.value.trim() : ''; if (!text || S.polishing) return;
      S.polishing = true; S.polishMsg = ''; renderMain();
      postJson('/api/inbox/polish', { text: text }).then(function(d){
        S.polishing = false;
        if (!d.success){ S.polishMsg = d.error || 'Polish failed.'; renderMain(); return; }
        S.prePolish = S.replyText; S.replyText = d.text; renderMain();
      }).catch(function(){ S.polishing = false; S.polishMsg = 'Polish failed. Try again.'; renderMain(); });
    },
    undoPolish: function(){ if (S.prePolish !== null){ S.replyText = S.prePolish; S.prePolish = null; renderMain(); } },
    toggleInvoice: function(){
      var c = active(); S.invoiceOpen = !S.invoiceOpen;
      if (S.invoiceOpen){ if (!S.billTo && c) S.billTo = c.name; if (!S.rows.length) S.rows = [newRow()]; }
      renderMain();
    },
    removeInvoice: function(){ S.invoiceOpen = false; S.rows = []; S.docType = 'invoice'; renderMain(); },
    setInvoice: function(){ S.docType = 'invoice'; renderMain(); },
    setQuote: function(){ S.docType = 'quote'; renderMain(); },
    addRow: function(){ S.rows.push(newRow()); renderMain(); },
    removeRow: function(t){ var id = parseInt(t.getAttribute('data-id'), 10); S.rows = S.rows.filter(function(r){ return r.id !== id; }); renderMain(); },
    toggleText: function(t, e){
      e.preventDefault();
      var c = active(); if (!c) return;
      var wanted = !c.textMode;
      postJson('/api/inbox/text-mode', { reference: c.reference, enabled: wanted }).then(function(d){
        if (!d.success) return;
        S.convos.forEach(function(x){ x.textMode = (wanted && x.reference === c.reference); });
        S.sig = sigOf(c); renderList();
        var w = $('textModeWrap'); if (w) w.innerHTML = textModeInner(c);
      });
    },
    send: function(){
      var c = active(); if (!c || S.sending) return;
      var text = (S.replyText || '').trim(); if (!text) return;
      S.error = '';
      var inv = collectInvoice(c);
      if (S.invoiceOpen && !inv){
        S.error = 'Add a line item with a description, or remove the ' + S.docType + ' — nothing was sent.';
        var el = $('errorLabel'); if (el) el.textContent = S.error; return;
      }
      S.sending = true; renderMain();
      var form = new FormData();
      form.append('reference', c.reference);
      form.append('replyText', text);
      S.files.forEach(function(f){ form.append('attachments', f); });
      if (inv) form.append('invoiceData', JSON.stringify(inv));
      if (S.reattach.length) form.append('reattach', JSON.stringify(S.reattach));
      apiFetch('/api/inbox/reply', { method: 'POST', body: form })
        .then(function(r){ return r.json().catch(function(){ return {}; }).then(function(d){ return { ok: r.ok, data: d }; }); })
        .then(function(res){
          S.sending = false;
          if (!res.ok || !res.data.success) throw new Error(res.data.error || 'Something went wrong.');
          S.replyText = ''; S.files = []; S.reattach = []; S.prePolish = null; S.invoiceOpen = false; S.rows = []; S.docType = 'invoice';
          S.billTo = ''; S.orderDesc = ''; S.address = ''; S.dueDate = ''; S.taxRate = ''; S.sentFlash = true;
          loadMessages(function(){
            setTimeout(function(){ S.sentFlash = false; var l = $('sentLabel'); if (l) l.style.opacity = '0'; }, 2500);
          }, false);
        })
        .catch(function(err){ S.sending = false; S.error = err.message; renderMain(); });
    },

    /* work folder */
    filter: function(t){ S.fileFilter = t.getAttribute('data-f'); renderMain(); },
    uploadFolder: function(){ $('folderFileInput').click(); },
    openFile: function(t){ S.viewer = parseInt(t.getAttribute('data-i'), 10); renderViewer(); },
    closeViewer: function(){ S.viewer = null; renderViewer(); },
    viewerBackdrop: function(t, e){ if (e.target.closest('[data-stop]')) return; S.viewer = null; renderViewer(); },
    prevFile: function(){ moveViewer(-1); },
    nextFile: function(){ moveViewer(1); },
    goFile: function(t){ S.viewer = parseInt(t.getAttribute('data-i'), 10); renderViewer(); },
    downloadFile: function(){
      var c = active(), f = currentViewerFile(); if (!c || !f) return;
      fileUrl(c, f).then(function(u){
        var a = document.createElement('a'); a.href = u; a.download = f.name; document.body.appendChild(a); a.click(); a.remove();
      });
    },
    deleteFile: function(){
      var c = active(), f = currentViewerFile(); if (!c || !f) return;
      if (!confirm('Delete "' + f.name + '" from this folder? This can\'t be undone.')) return;
      postJson('/api/inbox/folder/file/delete', { reference: c.reference, id: f.id }).then(function(d){
        if (!d.success) return;
        c.files = (c.files || []).filter(function(x){ return x.id !== f.id; });
        delete blobCache[c.reference + '/' + f.id];
        S.viewer = null; S.sig = sigOf(c); renderMain();
      });
    },
    addExpense: function(){
      var c = active(); if (!c) return;
      var amt = parseFloat(S.expAmt), desc = (S.expDesc || '').trim();
      if (!desc || isNaN(amt)) return;
      postJson('/api/inbox/folder/expense', { reference: c.reference, desc: desc, amount: amt }).then(function(d){
        if (!d.success){ S.folderMsg = d.error || 'Could not save that.'; renderMain(); return; }
        c.folder.expenses.push(d.entry); S.expDesc = ''; S.expAmt = ''; S.folderMsg = ''; S.sig = sigOf(c); renderMain();
      });
    },
    delExpense: function(t){
      var c = active(), id = t.getAttribute('data-id'); if (!c) return;
      postJson('/api/inbox/folder/expense/delete', { reference: c.reference, id: id }).then(function(d){
        if (!d.success) return; c.folder.expenses = c.folder.expenses.filter(function(x){ return x.id !== id; }); S.sig = sigOf(c); renderMain();
      });
    },
    delTime: function(t){
      var c = active(), id = t.getAttribute('data-id'); if (!c) return;
      postJson('/api/inbox/folder/time/delete', { reference: c.reference, id: id }).then(function(d){
        if (!d.success) return; c.folder.time = c.folder.time.filter(function(x){ return x.id !== id; }); S.sig = sigOf(c); renderMain();
      });
    },
    openManual: function(){ S.manualOpen = true; renderMain(); },
    closeManual: function(){ S.manualOpen = false; S.manTask = ''; S.timeDur = ''; renderMain(); },
    addManual: function(){
      var c = active(); if (!c) return;
      var m = parseDur(S.timeDur), task = (S.manTask || '').trim();
      if (!task || !m) { S.folderMsg = 'Add what you worked on and a time like 1h 30m.'; renderMain(); return; }
      S.folderMsg = '';
      addFolderTime(c.reference, task, m).then(function(ok){ if (ok){ S.manTask = ''; S.timeDur = ''; S.manualOpen = false; renderMain(); } });
    },
    toggleTimer: function(){
      var c = active(); if (!c) return;
      if (S.timer){
        var ref = S.timer.ref;
        var mins = Math.max(1, Math.round((Date.now() - S.timer.start) / 60000));
        var task = ((ref === c.reference ? S.timeTask : '') || '').trim() || S.timer.task || 'Work session';
        S.timer = null; saveTimer(); S.timeTask = '';
        addFolderTime(ref, task, mins);
      } else {
        S.timer = { ref: c.reference, start: Date.now(), task: (S.timeTask || '').trim() };
        saveTimer(); renderMain();
      }
    }
  };

  document.addEventListener('click', function(e){
    var t = e.target.closest('[data-act]');
    if (!t) return;
    var na = e.target.closest('[data-noact]');
    if (na && na.contains(t) === false) return; // click on e.g. a date box inside a clickable row
    var fn = ACT[t.getAttribute('data-act')];
    if (fn) fn(t, e);
  });

  document.addEventListener('input', function(e){
    var t = e.target;
    if (t.hasAttribute('data-bind')){ S[t.getAttribute('data-bind')] = t.value; if (t.getAttribute('data-bind') === 'taxRate') updateTotals(); return; }
    if (t.hasAttribute('data-row')){
      var id = parseInt(t.getAttribute('data-row'), 10), k = t.getAttribute('data-k');
      var r = S.rows.filter(function(x){ return x.id === id; })[0]; if (r) r[k] = t.value;
      updateTotals();
    }
  });
  document.addEventListener('change', function(e){
    var t = e.target;
    if (t.getAttribute && t.getAttribute('data-chg') === 'payDue'){
      var pc = byRef(t.getAttribute('data-ref')), pid = t.getAttribute('data-id'), ms = endOfDay(t.value);
      if (!pc || !ms) return;
      postJson('/api/inbox/folder/payment/due', { reference: pc.reference, id: pid, dueAt: ms }).then(function(d){
        if (!d.success) return;
        pc.folder.payments = pays(pc).map(function(x){ return x.id === pid ? d.payment : x; });
        S.sig = sigOf(active()); renderList();
        renderMain();
      });
      return;
    }
    var c = active();
    if (!c || !t.hasAttribute('data-chg')) return;
    var which = t.getAttribute('data-chg');
    if (which === 'folderName'){
      postJson('/api/inbox/folder/update', { reference: c.reference, name: t.value }).then(function(d){ if (d.success){ c.folder.name = t.value; S.sig = sigOf(c); } });
    } else if (which === 'scTitle'){ saveSite(c, { title: t.value }, true);
    } else if (which === 'scCategory'){ saveSite(c, { category: t.value }, true);
    } else if (which === 'scWriteup'){ saveSite(c, { writeup: t.value }, true);
    } else if (which === 'scComment'){ saveSite(c, { comment: t.value }, true);
    } else if (which === 'scCommentName'){ saveSite(c, { commentName: t.value }, true);
    } else if (which === 'scShowComment'){ saveSite(c, { showComment: t.checked });
    } else if (which === 'folderQuoted'){
      postJson('/api/inbox/folder/update', { reference: c.reference, quoted: t.value }).then(function(d){
        if (d.success){ c.folder.quoted = t.value === '' || isNaN(parseFloat(t.value)) ? null : Math.round(parseFloat(t.value) * 100) / 100; S.sig = sigOf(c); renderMain(); }
      });
    }
  });
  document.addEventListener('keydown', function(e){
    var t = e.target;
    if (e.key === 'Enter' && t.getAttribute && t.getAttribute('data-enter')){
      e.preventDefault();
      var fn = ACT[t.getAttribute('data-enter')]; if (fn) fn(t, e);
    }
    if (e.key === 'Escape' && S.editingName && t.id === 'nameInput') ACT.cancelName();
  });

  /* drag & drop onto the reply toolbar */
  document.addEventListener('dragover', function(e){ if (e.target.closest && e.target.closest('#toolbar')){ e.preventDefault(); $('toolbar').style.background = '#F4F1EA'; } });
  document.addEventListener('dragleave', function(e){ var tb = $('toolbar'); if (tb) tb.style.background = 'transparent'; });
  document.addEventListener('drop', function(e){
    if (!(e.target.closest && e.target.closest('#toolbar'))) return;
    e.preventDefault(); $('toolbar').style.background = 'transparent';
    if (e.dataTransfer.files.length){ S.files = S.files.concat(Array.prototype.slice.call(e.dataTransfer.files)); renderChips(); }
  });
  $('replyFileInput').addEventListener('change', function(e){
    if (e.target.files.length){ S.files = S.files.concat(Array.prototype.slice.call(e.target.files)); renderChips(); }
    e.target.value = '';
  });
  $('folderFileInput').addEventListener('change', function(e){
    var c = active(); var list = Array.prototype.slice.call(e.target.files); e.target.value = '';
    if (!c || !list.length) return;
    var form = new FormData(); form.append('reference', c.reference);
    list.forEach(function(f){ form.append('files', f); });
    S.folderMsg = 'Uploading…'; renderMain();
    apiFetch('/api/inbox/folder/upload', { method: 'POST', body: form })
      .then(function(r){ return r.json().catch(function(){ return {}; }).then(function(d){ d._ok = r.ok; return d; }); })
      .then(function(d){
        if (!d.success){ S.folderMsg = d.error || 'Upload failed (files can be up to 10 MB each).'; renderMain(); return; }
        c.files = (c.files || []).concat(d.files || []); S.folderMsg = ''; S.sig = sigOf(c); renderMain();
      })
      .catch(function(){ S.folderMsg = 'Upload failed. Try again.'; renderMain(); });
  });

  $('searchBox').addEventListener('input', function(){ S.search = this.value; renderList(); });

  /* ---------- backup ---------- */
  var backupMsg = $('backupMsg');
  function showBackupMsg(text, isError){ backupMsg.style.color = isError ? '#b23b3b' : '#A9784F'; backupMsg.textContent = text; }
  $('downloadBackupBtn').addEventListener('click', function(){
    showBackupMsg('Preparing…');
    apiFetch('/api/inbox/export')
      .then(function(r){ if (!r.ok) throw new Error(); return r.blob(); })
      .then(function(blob){
        var url = URL.createObjectURL(blob), a = document.createElement('a');
        a.href = url; a.download = 'mylucent-backup-' + new Date().toISOString().slice(0, 10) + '.json';
        document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
        showBackupMsg('Backup downloaded.');
      })
      .catch(function(){ showBackupMsg('Could not download the backup.', true); });
  });
  var restoreInput = $('restoreFileInput');
  $('restoreBackupBtn').addEventListener('click', function(){ restoreInput.click(); });
  restoreInput.addEventListener('change', function(){
    var file = restoreInput.files[0]; if (!file) return;
    var form = new FormData(); form.append('backup', file);
    showBackupMsg('Restoring…');
    apiFetch('/api/inbox/import', { method: 'POST', body: form })
      .then(function(r){ return r.json().then(function(d){ return { ok: r.ok, data: d }; }); })
      .then(function(res){
        restoreInput.value = '';
        if (!res.ok || !res.data.success){ showBackupMsg(res.data.error || 'Restore failed.', true); return; }
        showBackupMsg('Restored: ' + res.data.added.inquiries + ' conversations, ' + res.data.added.completedOrders + ' paid orders added.');
        loadMessages(null, false);
      })
      .catch(function(){ restoreInput.value = ''; showBackupMsg('Restore failed.', true); });
  });

  /* ---------- start ---------- */
  if (getKey()){
    loadMessages(function(ok){
      if (ok){ $('loginScreen').style.display = 'none'; $('inboxScreen').style.display = 'flex'; }
    });
  }
  setInterval(function(){
    if ($('inboxScreen').style.display === 'flex') loadMessages(null, true);
  }, 25000);
})();
</script>
