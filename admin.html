<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>myLucent — Inbox</title>
<meta name="robots" content="noindex, nofollow">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Spectral:wght@400;500;600&family=Inter:wght@300;400;500;600&display=swap');
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Inter',sans-serif;background:#EDEAE2;color:#1B2733;}
  a{color:inherit;text-decoration:none;}

  /* Login screen */
  #loginScreen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
  .login-card{background:#fff;border-radius:14px;padding:40px 36px;max-width:360px;width:100%;box-shadow:0 24px 48px -28px rgba(27,39,51,0.25);}
  .login-card h1{font-family:'Spectral',serif;font-size:20px;font-weight:500;margin:0 0 6px;text-align:center;}
  .login-card p{font-size:12.5px;color:rgba(27,39,51,0.55);text-align:center;margin:0 0 24px;}
  .login-card input{width:100%;padding:12px 14px;border:1px solid rgba(27,39,51,0.18);border-radius:8px;font-size:14px;font-family:'Inter',sans-serif;margin-bottom:14px;}
  .login-card input:focus{outline:none;border-color:#A9784F;}
  .login-error{font-size:12.5px;color:#b23b3b;text-align:center;margin:-6px 0 14px;display:none;}
  .login-error.show{display:block;}

  /* Inbox */
  .msg-card{background:#fff;border-radius:12px;padding:16px;cursor:pointer;transition:box-shadow .25s,opacity .25s;}
  .msg-card:hover{box-shadow:0 8px 20px -8px rgba(27,39,51,0.18);}
  .msg-card.waiting{box-shadow:0 10px 26px -8px rgba(27,39,51,0.45);}
  .msg-card.waiting:hover{box-shadow:0 14px 30px -8px rgba(27,39,51,0.55);}
  .msg-card.hidden-by-search{display:none;}
  .name-row{display:flex;justify-content:space-between;gap:6px;white-space:nowrap;}
  .name-txt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;font-size:13.5px;color:#1B2733;}
  .prev-txt{font-size:12.5px;color:rgba(27,39,51,0.55);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px;}
  .btn-solid{background:#1B2733;color:#F4F1EA;border:none;border-radius:8px;padding:10px 22px;font-size:12.5px;letter-spacing:0.5px;cursor:pointer;font-family:'Inter',sans-serif;transition:background .3s;white-space:nowrap;width:fit-content;}
  .btn-solid:hover{background:#A9784F;}
  .btn-solid:disabled{opacity:0.5;cursor:default;}
  .attach-zone{border:1.5px dashed rgba(27,39,51,0.22);border-radius:10px;padding:18px;text-align:center;font-size:12.5px;color:rgba(27,39,51,0.5);cursor:pointer;transition:border-color .25s,background .25s;}
  .attach-zone:hover, .attach-zone.drag{border-color:#A9784F;background:rgba(169,120,79,0.05);color:#A9784F;}
  .attach-chip{display:inline-flex;align-items:center;gap:8px;background:#F4F1EA;border-radius:8px;padding:6px 10px 6px 12px;font-size:12px;color:#1B2733;}
  .attach-chip button{border:none;background:none;color:rgba(27,39,51,0.5);cursor:pointer;font-size:14px;line-height:1;padding:0;}
  .attach-chip button:hover{color:#A9784F;}
  .empty-state{padding:60px 20px;text-align:center;color:rgba(27,39,51,0.4);font-size:13.5px;}

  /* Explicit, defensive wrapping rules for the reply box — guarantees
     text always wraps within the box rather than overflowing, on any
     browser/device. */
  #replyText{
    box-sizing:border-box;
    white-space:pre-wrap;
    word-wrap:break-word;
    overflow-wrap:break-word;
    overflow-x:hidden;
    padding-right:40px;
  }

  /* Voice-to-text mic button, sits inside the top-right corner of the reply box */
  .reply-textwrap{ position:relative; }
  #micBtn{
    position:absolute; top:8px; right:8px;
    width:28px; height:28px; border-radius:50%;
    background:#F4F1EA; border:1px solid rgba(27,39,51,0.15);
    color:#1B2733; font-size:14px; line-height:1; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    transition:background .25s, color .25s, box-shadow .25s;
  }
  #micBtn:hover{ border-color:#A9784F; color:#A9784F; }
  #micBtn.listening{
    background:#b23b3b; border-color:#b23b3b; color:#fff;
    box-shadow:0 0 0 4px rgba(178,59,59,0.18);
    animation:micPulse 1.4s ease-in-out infinite;
  }
  .switch{position:relative;width:36px;height:20px;flex-shrink:0;}
  .switch input{opacity:0;width:0;height:0;position:absolute;}
  .switch .slider{position:absolute;inset:0;background:rgba(27,39,51,0.2);border-radius:20px;transition:background .25s;}
  .switch .slider::before{content:'';position:absolute;width:14px;height:14px;left:3px;top:3px;background:#fff;border-radius:50%;transition:transform .25s;}
  .switch input:checked + .slider{background:#A9784F;}
  .switch input:checked + .slider::before{transform:translateX(16px);}
  .doctype-btn{border:none;background:#fff;color:#1B2733;font-size:12.5px;padding:7px 18px;cursor:pointer;font-family:'Inter',sans-serif;}
  .doctype-btn.active{background:#1B2733;color:#F4F1EA;}
  @keyframes micPulse{
    0%,100%{ box-shadow:0 0 0 4px rgba(178,59,59,0.18); }
    50%{ box-shadow:0 0 0 8px rgba(178,59,59,0.10); }
  }

  @media (max-width:820px){
    .inbox-outer{ padding:16px !important; }
    .inbox-shell{ flex-direction:column !important; min-height:0 !important; }
    .inbox-sidebar{ width:100% !important; border-right:none !important; border-bottom:1px solid rgba(27,39,51,0.08); }
    #msgList{ max-height:none !important; }
    .inbox-detail{ padding:24px 20px !important; }
  }
</style>
</head>
<body>

<div id="loginScreen">
  <div class="login-card">
    <h1>myLucent — Inbox</h1>
    <p>Enter your admin key to continue.</p>
    <div class="login-error" id="loginError">Incorrect key. Try again.</div>
    <input type="password" id="keyInput" placeholder="Admin key" autocomplete="off">
    <button class="btn-solid" id="loginBtn" style="width:100%;text-align:center;">Enter</button>
  </div>
</div>

<div id="inboxScreen" style="display:none;min-height:100vh;padding:32px;" class="inbox-outer">
  <div style="max-width:1160px;margin:0 auto 20px;display:flex;align-items:center;justify-content:space-between;">
    <div style="font-family:'Spectral',serif;font-size:19px;">myLucent <span style="color:#A9784F;">— Inbox</span></div>
    <div style="font-size:10.5px;letter-spacing:1.5px;color:rgba(27,39,51,0.45);">PRIVATE — NOT LINKED IN SITE NAV</div>
  </div>

  <div class="inbox-shell" style="max-width:1160px;margin:0 auto;display:flex;min-height:600px;background:#FBFAF7;border-radius:14px;overflow:hidden;box-shadow:0 20px 50px -20px rgba(27,39,51,0.18);">

    <div class="inbox-sidebar" style="width:340px;border-right:1px solid rgba(27,39,51,0.08);padding:24px;flex-shrink:0;">
      <div style="font-family:'Spectral',serif;font-size:17px;margin-bottom:18px;">
        Messages <span id="unreadBadge" style="background:#A9784F;color:#fff;font-size:11px;padding:2px 8px;border-radius:20px;margin-left:6px;"></span>
      </div>
      <input id="searchBox" placeholder="Search messages…" style="width:100%;background:#fff;border:1px solid rgba(27,39,51,0.1);border-radius:10px;padding:10px 14px;font-size:13px;color:#1B2733;margin-bottom:18px;font-family:'Inter',sans-serif;">
      <div id="msgList" style="display:flex;flex-direction:column;gap:10px;max-height:70vh;overflow-y:auto;"></div>
    </div>

    <div id="detailPane" class="inbox-detail" style="flex:1;padding:36px 40px;min-width:0;">
      <div class="empty-state">Select a message to view it.</div>
    </div>

  </div>
</div>

<script>
  var ADMIN_KEY_STORAGE = 'mylucent_admin_key';
  var messages = [];
  var activeReference = null;
  var pendingFiles = [];

  var loginScreen = document.getElementById('loginScreen');
  var inboxScreen = document.getElementById('inboxScreen');
  var keyInput = document.getElementById('keyInput');
  var loginBtn = document.getElementById('loginBtn');
  var loginError = document.getElementById('loginError');
  var msgList = document.getElementById('msgList');
  var detailPane = document.getElementById('detailPane');
  var unreadBadge = document.getElementById('unreadBadge');
  var searchBox = document.getElementById('searchBox');

  function getKey(){ return sessionStorage.getItem(ADMIN_KEY_STORAGE) || ''; }

  function apiFetch(url, options){
    options = options || {};
    options.headers = options.headers || {};
    options.headers['X-Admin-Key'] = getKey();
    return fetch(url, options);
  }

  function tryLogin(key){
    sessionStorage.setItem(ADMIN_KEY_STORAGE, key);
    loadMessages(function(ok){
      if (ok){
        loginScreen.style.display = 'none';
        inboxScreen.style.display = 'block';
      } else {
        sessionStorage.removeItem(ADMIN_KEY_STORAGE);
        loginError.classList.add('show');
      }
    });
  }

  loginBtn.addEventListener('click', function(){
    loginError.classList.remove('show');
    var key = keyInput.value.trim();
    if (!key) return;
    tryLogin(key);
  });
  keyInput.addEventListener('keydown', function(e){ if (e.key === 'Enter') loginBtn.click(); });

  function formatTime(ts){
    var d = new Date(ts);
    var now = new Date();
    var sameDay = d.toDateString() === now.toDateString();
    if (sameDay) return d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
    return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
  }

  function initials(name){
    var parts = name.trim().split(/\s+/);
    return ((parts[0] || '')[0] || '').toUpperCase() + ((parts[1] || '')[0] || '').toUpperCase();
  }

  function loadMessages(callback, silent){
    apiFetch('/api/inbox/messages')
      .then(function(r){ return r.json().then(function(data){ return { ok: r.ok, data: data }; }); })
      .then(function(result){
        if (!result.ok){
          if (callback) callback(false);
          return;
        }
        // Signature of the open conversation before/after, so the background
        // refresh only redraws the reply area when something actually changed
        // (a new message or reply). Otherwise it left alone — redrawing
        // every 25 seconds was wiping whatever was being typed.
        function sig(list){
          var c = list.find(function(x){ return x.reference === activeReference; });
          return c ? c.messages.length + '|' + c.replies.length + '|' + c.status + '|' + (c.textMode ? 1 : 0) : '';
        }
        var before = sig(messages);
        messages = result.data.messages;
        renderList();
        var changed = before !== sig(messages);
        if (activeReference){
          var wrap = document.getElementById('threadWrap');
          if (!silent || !wrap){
            renderDetail(activeReference);
          } else if (changed){
            // Background refresh: update only the conversation thread, so
            // the reply box, attachments and invoice/quote panel are left
            // exactly as they are.
            var cur = messages.find(function(x){ return x.reference === activeReference; });
            if (cur){
              wrap.innerHTML = buildThreadHtml(cur);
              var tm = document.getElementById('textModeToggle');
              if (tm) tm.checked = !!cur.textMode;
              var tn = document.getElementById('textModeNote');
              if (tn) tn.style.display = cur.textMode ? 'block' : 'none';
            }
          }
        }
        if (callback) callback(true);
      })
      .catch(function(){ if (callback && !silent) callback(false); });
  }

  function renderList(){
    var filter = searchBox.value.trim().toLowerCase();
    var unreadCount = messages.filter(function(m){ return m.status === 'unread'; }).length;
    unreadBadge.textContent = unreadCount + ' new';
    unreadBadge.style.display = unreadCount > 0 ? 'inline-block' : 'none';

    msgList.innerHTML = '';
    if (messages.length === 0){
      msgList.innerHTML = '<div class="empty-state" style="padding:30px 10px;">No messages yet.</div>';
      return;
    }

    messages.forEach(function(m){
      var lastMsg = m.messages[m.messages.length - 1].text;
      var matches = !filter || (m.name + ' ' + m.email + ' ' + m.messages.map(function(x){return x.text;}).join(' ')).toLowerCase().indexOf(filter) !== -1;
      var card = document.createElement('div');
      card.className = 'msg-card' + (m.status !== 'replied' ? ' waiting' : '') + (matches ? '' : ' hidden-by-search');
      var isActive = m.reference === activeReference;
      var avatarBg = m.status === 'unread' ? '#1B2733' : 'rgba(27,39,51,0.1)';
      var avatarFg = m.status === 'unread' ? '#F4F1EA' : '#1B2733';
      var weight = m.status === 'unread' ? 600 : 500;
      card.style.borderLeft = isActive ? '3px solid #A9784F' : '3px solid transparent';
      card.style.opacity = m.status === 'replied' ? '0.7' : '1';

      var statusLabel = m.status === 'replied' ? '<span style="font-size:11px;color:#8FA98F;">✓ Replied</span>' : '<span style="font-size:11px;color:rgba(27,39,51,0.4);">' + formatTime(m.lastActivityAt) + '</span>';

      card.innerHTML =
        '<div style="display:flex;gap:12px;align-items:flex-start;">' +
          '<div style="width:38px;height:38px;border-radius:50%;background:' + avatarBg + ';color:' + avatarFg + ';display:flex;align-items:center;justify-content:center;font-size:13px;font-family:\'Spectral\',serif;flex-shrink:0;">' + initials(m.name) + '</div>' +
          '<div style="flex:1;min-width:0;">' +
            '<div class="name-row"><span class="name-txt" style="font-weight:' + weight + ';">' + m.name + (m.messages.length > 1 ? ' <span style="font-weight:400;color:rgba(27,39,51,0.4);">(' + m.messages.length + ')</span>' : '') + (m.textMode ? ' <span title="Text replies on">📱</span>' : '') + '</span>' + statusLabel + '</div>' +
            '<div class="prev-txt">' + lastMsg + '</div>' +
          '</div>' +
        '</div>';

      card.addEventListener('click', function(){ selectMessage(m.reference); });
      msgList.appendChild(card);
    });
  }

  function selectMessage(reference){
    activeReference = reference;
    pendingFiles = [];
    var m = messages.find(function(x){ return x.reference === reference; });
    if (m && m.status === 'unread'){
      apiFetch('/api/inbox/mark-read', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ reference: reference })
      }).then(function(){
        m.status = 'read';
        renderList();
      });
    } else {
      renderList();
    }
    renderDetail(reference);
  }

  function escapeHtml(s){
    return (s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function buildThreadHtml(m){
    var html = '<div style="max-width:460px;margin-bottom:28px;">';

    // Merge every original message and every reply into one timeline,
    // sorted chronologically, so the conversation reads in the order it
    // actually happened.
    var timeline = [];
    (m.messages || []).forEach(function(msg){
      timeline.push({ kind: 'them', text: msg.text, at: msg.receivedAt });
    });
    (m.replies || []).forEach(function(r){
      timeline.push({ kind: 'you', text: r.text, at: r.sentAt, attachmentNames: r.attachmentNames });
    });
    timeline.sort(function(a, b){ return a.at - b.at; });

    timeline.forEach(function(item){
      if (item.kind === 'them'){
        html +=
          '<div style="background:#fff;border-radius:12px;padding:16px 18px;margin-bottom:14px;">' +
            '<div style="font-size:10px;letter-spacing:1px;color:rgba(27,39,51,0.4);margin-bottom:6px;">' + m.name.toUpperCase() + ' · ' + formatTime(item.at) + '</div>' +
            '<div style="font-size:14px;line-height:1.7;color:#1B2733;">' + escapeHtml(item.text) + '</div>' +
          '</div>';
      } else {
        var attachHtml = '';
        if (item.attachmentNames && item.attachmentNames.length){
          attachHtml = '<div style="font-size:11.5px;color:rgba(244,241,234,0.7);margin-top:8px;">📎 ' + item.attachmentNames.map(escapeHtml).join(', ') + '</div>';
        }
        html +=
          '<div style="background:#1B2733;color:#F4F1EA;border-radius:12px;padding:16px 18px;margin-bottom:14px;margin-left:24px;">' +
            '<div style="font-size:10px;letter-spacing:1px;color:rgba(244,241,234,0.5);margin-bottom:6px;">YOU REPLIED · ' + formatTime(item.at) + '</div>' +
            '<div style="font-size:14px;line-height:1.7;">' + escapeHtml(item.text) + '</div>' +
            attachHtml +
          '</div>';
      }
    });

    html += '</div>';
    return html;
  }

  function renderDetail(reference){
    var m = messages.find(function(x){ return x.reference === reference; });
    if (!m) return;

    detailPane.innerHTML =
      '<div style="display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:24px;">' +
        '<div style="display:flex;align-items:center;gap:14px;">' +
          '<div style="width:46px;height:46px;border-radius:50%;background:#1B2733;color:#F4F1EA;display:flex;align-items:center;justify-content:center;font-size:15px;font-family:\'Spectral\',serif;">' + initials(m.name) + '</div>' +
          '<div><div style="font-family:\'Spectral\',serif;font-size:20px;">' + m.name + '</div><div style="font-size:12.5px;color:rgba(27,39,51,0.5);">' + m.email + '</div></div>' +
        '</div>' +
        '<button id="deleteMsgBtn" style="background:none;border:1px solid rgba(178,59,59,0.35);color:#b23b3b;font-size:12px;padding:8px 14px;border-radius:8px;cursor:pointer;font-family:\'Inter\',sans-serif;white-space:nowrap;">Delete</button>' +
      '</div>' +
      '<div id="threadWrap">' + buildThreadHtml(m) + '</div>' +
      '<div style="background:#fff;border-radius:12px;padding:20px;box-shadow:0 4px 14px -6px rgba(27,39,51,0.1);max-width:460px;">' +
        '<div class="reply-textwrap">' +
          '<textarea id="replyText" placeholder="Type your reply…" style="width:100%;border:none;outline:none;font-family:\'Inter\',sans-serif;font-size:14px;min-height:70px;resize:vertical;color:#1B2733;"></textarea>' +
          '<button type="button" id="micBtn" title="Dictate reply" style="display:none;">🎤</button>' +
        '</div>' +
        '<div id="micStatus" style="font-size:11.5px;color:rgba(27,39,51,0.45);margin-top:4px;display:none;">Listening… tap the mic again to stop</div>' +
        '<div style="display:flex;align-items:center;gap:12px;margin:6px 0 10px;">' +
          '<button type="button" id="polishBtn" style="background:none;border:1px solid rgba(27,39,51,0.2);color:#1B2733;font-size:12px;padding:5px 12px;border-radius:7px;cursor:pointer;font-family:\'Inter\',sans-serif;">✨ Polish</button>' +
          '<button type="button" id="undoPolishBtn" style="display:none;background:none;border:none;color:#A9784F;font-size:12px;cursor:pointer;font-family:\'Inter\',sans-serif;padding:0;">↩ Undo</button>' +
          '<span id="polishMsg" style="font-size:11.5px;color:#b23b3b;"></span>' +
        '</div>' +
        '<div class="attach-zone" id="attachZone">📎 Drop files here, or click to attach</div>' +
        '<input type="file" id="fileInput" multiple style="display:none;">' +
        '<div id="attachChips" style="display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;"></div>' +

        '<div style="margin-top:14px;">' +
          '<button type="button" id="toggleInvoiceBtn" style="background:none;border:none;color:#A9784F;font-size:12.5px;cursor:pointer;font-family:\'Inter\',sans-serif;padding:0;">📄 Add Invoice / Quote</button>' +
        '</div>' +

        '<div id="invoicePanel" style="display:none;margin-top:16px;padding-top:16px;border-top:1px solid rgba(27,39,51,0.08);">' +
          '<div id="docTypeToggle" style="display:inline-flex;border:1px solid rgba(27,39,51,0.2);border-radius:8px;overflow:hidden;margin-bottom:14px;">' +
            '<button type="button" id="docTypeInvoice" class="doctype-btn active">Invoice</button>' +
            '<button type="button" id="docTypeQuote" class="doctype-btn">Quote</button>' +
          '</div>' +
          '<div id="quoteNotice" style="display:none;font-size:12px;line-height:1.5;color:#1B2733;background:#F4EDE4;border:1px solid #A9784F;border-radius:8px;padding:10px 12px;margin-bottom:12px;">This is an approximate quote only. Final pricing may increase by up to 15% depending on design complexity, materials, and any changes requested.</div>' +
          '<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px;">' +
            '<input id="invBillToName" placeholder="Bill to (name)" value="' + m.name + '" style="grid-column:1/3;padding:9px 11px;border:1px solid rgba(27,39,51,0.15);border-radius:7px;font-size:13px;font-family:\'Inter\',sans-serif;">' +
            '<textarea id="invBillToAddress" placeholder="Billing address (optional)" style="grid-column:1/3;padding:9px 11px;border:1px solid rgba(27,39,51,0.15);border-radius:7px;font-size:13px;font-family:\'Inter\',sans-serif;min-height:44px;resize:vertical;"></textarea>' +
            '<input id="invOrderDesc" placeholder="Order description" style="padding:9px 11px;border:1px solid rgba(27,39,51,0.15);border-radius:7px;font-size:13px;font-family:\'Inter\',sans-serif;">' +
            '<input id="invDueDate" placeholder="Due date (optional)" style="padding:9px 11px;border:1px solid rgba(27,39,51,0.15);border-radius:7px;font-size:13px;font-family:\'Inter\',sans-serif;">' +
          '</div>' +

          '<div id="invItemsHeader" style="display:grid;grid-template-columns:1fr 50px 80px 80px 24px;gap:8px;font-size:10px;letter-spacing:1px;color:rgba(27,39,51,0.4);margin-bottom:6px;">' +
            '<span>DESCRIPTION</span><span>QTY</span><span>PRICE</span><span style="text-align:right;">AMOUNT</span><span></span>' +
          '</div>' +
          '<div id="invItemsContainer"></div>' +
          '<button type="button" id="addInvItemBtn" style="background:none;border:1px dashed rgba(27,39,51,0.25);color:rgba(27,39,51,0.6);font-size:12px;padding:8px 12px;border-radius:7px;cursor:pointer;font-family:\'Inter\',sans-serif;width:100%;margin-top:4px;">+ Add Line Item</button>' +

          '<div style="display:flex;align-items:center;gap:8px;margin-top:14px;">' +
            '<label style="font-size:12px;color:rgba(27,39,51,0.6);">Tax rate</label>' +
            '<input id="invTaxRate" type="number" step="0.001" placeholder="0" style="width:70px;padding:6px 8px;border:1px solid rgba(27,39,51,0.15);border-radius:6px;font-size:12.5px;font-family:\'Inter\',sans-serif;">' +
            '<span style="font-size:12px;color:rgba(27,39,51,0.5);">%</span>' +
          '</div>' +

          '<div id="invTotals" style="margin-top:14px;padding-top:12px;border-top:1px solid rgba(27,39,51,0.08);font-size:13px;"></div>' +

          '<button type="button" id="removeInvoiceBtn" style="background:none;border:none;color:#b23b3b;font-size:11.5px;cursor:pointer;font-family:\'Inter\',sans-serif;padding:0;margin-top:12px;">Remove invoice</button>' +
        '</div>' +

        '<div style="margin-top:16px;padding-top:14px;border-top:1px solid rgba(27,39,51,0.08);">' +
          '<label style="display:flex;align-items:center;gap:10px;cursor:pointer;font-size:12.5px;color:#1B2733;">' +
            '<span class="switch"><input type="checkbox" id="textModeToggle"' + (m.textMode ? ' checked' : '') + '><span class="slider"></span></span>' +
            '<span>📱 Reply by text — your texts go straight to this customer</span>' +
          '</label>' +
          '<div id="textModeNote" style="font-size:11.5px;color:rgba(27,39,51,0.5);margin:6px 0 0 46px;' + (m.textMode ? '' : 'display:none;') + '">On: texts from your phone are emailed to ' + m.name + ' with no code. Stays on until you switch it off.</div>' +
        '</div>' +

        '<div style="margin-top:16px;display:flex;align-items:center;gap:16px;">' +
          '<button class="btn-solid" id="sendReplyBtn">Send Reply</button>' +
          '<span id="sentLabel" style="font-size:12px;color:#A9784F;opacity:0;transition:opacity .3s;">Sent ✓</span>' +
          '<span id="errorLabel" style="font-size:12px;color:#b23b3b;"></span>' +
        '</div>' +
      '</div>';

    document.getElementById('deleteMsgBtn').addEventListener('click', function(){
      if (!confirm('Delete this message from ' + m.name + '? This can\'t be undone.')) return;
      apiFetch('/api/inbox/delete', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ reference: m.reference })
      })
        .then(function(r){ return r.json(); })
        .then(function(data){
          if (!data.success) return;
          messages = messages.filter(function(x){ return x.reference !== m.reference; });
          activeReference = null;
          renderList();
          detailPane.innerHTML = '<div class="empty-state">Select a message to view it.</div>';
        });
    });

    var attachZone = document.getElementById('attachZone');
    var fileInput = document.getElementById('fileInput');
    var attachChips = document.getElementById('attachChips');
    var sendBtn = document.getElementById('sendReplyBtn');
    var sentLabel = document.getElementById('sentLabel');
    var errorLabel = document.getElementById('errorLabel');
    var replyTextEl = document.getElementById('replyText');

    // --- Voice-to-text dictation (Web Speech API) ---
    // Only Chrome/Edge (desktop + Android) support this; Firefox and Safari
    // (incl. iOS Safari) do not. We feature-detect and simply hide the mic
    // button on unsupported browsers rather than showing something broken.
    (function setupVoiceDictation(){
      var micBtn = document.getElementById('micBtn');
      var micStatus = document.getElementById('micStatus');
      var SpeechRecognitionCtor = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognitionCtor || !micBtn) return; // not supported — leave button hidden

      micBtn.style.display = 'flex';

      var recognition = new SpeechRecognitionCtor();
      recognition.continuous = true;
      recognition.interimResults = true;
      recognition.lang = 'en-AU';

      var listening = false;
      var baseText = ''; // text already in the box when dictation started
      var finalTranscript = '';

      function startListening(){
        baseText = replyTextEl.value;
        if (baseText && !/\s$/.test(baseText)) baseText += ' ';
        finalTranscript = '';
        try { recognition.start(); } catch (e) { /* already started */ }
      }

      function stopListening(){
        try { recognition.stop(); } catch (e) {}
      }

      micBtn.addEventListener('click', function(){
        if (listening) { stopListening(); } else { startListening(); }
      });

      recognition.addEventListener('start', function(){
        listening = true;
        micBtn.classList.add('listening');
        micStatus.style.display = 'block';
      });

      recognition.addEventListener('end', function(){
        listening = false;
        micBtn.classList.remove('listening');
        micStatus.style.display = 'none';
      });

      recognition.addEventListener('error', function(){
        listening = false;
        micBtn.classList.remove('listening');
        micStatus.style.display = 'none';
      });

      recognition.addEventListener('result', function(e){
        var interim = '';
        for (var i = e.resultIndex; i < e.results.length; i++){
          var transcriptPiece = e.results[i][0].transcript;
          if (e.results[i].isFinal) {
            finalTranscript += transcriptPiece + ' ';
          } else {
            interim += transcriptPiece;
          }
        }
        replyTextEl.value = baseText + finalTranscript + interim;
      });
    })();

    function renderChips(){
      attachChips.innerHTML = '';
      pendingFiles.forEach(function(f, idx){
        var chip = document.createElement('div');
        chip.className = 'attach-chip';
        chip.innerHTML = f.name + ' <button type="button">×</button>';
        chip.querySelector('button').addEventListener('click', function(){
          pendingFiles.splice(idx, 1);
          renderChips();
        });
        attachChips.appendChild(chip);
      });
    }

    attachZone.addEventListener('click', function(){ fileInput.click(); });
    fileInput.addEventListener('change', function(e){
      if (e.target.files.length){
        pendingFiles = pendingFiles.concat(Array.from(e.target.files));
        renderChips();
      }
      e.target.value = '';
    });
    attachZone.addEventListener('dragover', function(e){ e.preventDefault(); attachZone.classList.add('drag'); });
    attachZone.addEventListener('dragleave', function(){ attachZone.classList.remove('drag'); });
    attachZone.addEventListener('drop', function(e){
      e.preventDefault();
      attachZone.classList.remove('drag');
      if (e.dataTransfer.files.length){
        pendingFiles = pendingFiles.concat(Array.from(e.dataTransfer.files));
        renderChips();
      }
    });

    // --- Polish (AI proofread: punctuation + light flow only) ---
    var polishBtn = document.getElementById('polishBtn');
    var undoPolishBtn = document.getElementById('undoPolishBtn');
    var polishMsg = document.getElementById('polishMsg');
    var beforePolish = null;
    polishBtn.addEventListener('click', function(){
      var text = replyTextEl.value.trim();
      if (!text) return;
      polishMsg.textContent = '';
      polishBtn.disabled = true;
      polishBtn.textContent = 'Polishing…';
      apiFetch('/api/inbox/polish', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text: text })
      })
        .then(function(r){ return r.json(); })
        .then(function(data){
          polishBtn.disabled = false;
          polishBtn.textContent = '✨ Polish';
          if (!data.success) { polishMsg.textContent = data.error || 'Polish failed.'; return; }
          beforePolish = replyTextEl.value;
          replyTextEl.value = data.text;
          undoPolishBtn.style.display = 'inline';
        })
        .catch(function(){
          polishBtn.disabled = false;
          polishBtn.textContent = '✨ Polish';
          polishMsg.textContent = 'Polish failed. Try again.';
        });
    });
    undoPolishBtn.addEventListener('click', function(){
      if (beforePolish !== null) replyTextEl.value = beforePolish;
      beforePolish = null;
      undoPolishBtn.style.display = 'none';
    });

    // --- Text-mode toggle ---
    var textModeToggle = document.getElementById('textModeToggle');
    var textModeNote = document.getElementById('textModeNote');
    textModeToggle.addEventListener('change', function(){
      var wanted = textModeToggle.checked;
      textModeToggle.disabled = true;
      apiFetch('/api/inbox/text-mode', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ reference: m.reference, enabled: wanted })
      })
        .then(function(r){ return r.json(); })
        .then(function(data){
          textModeToggle.disabled = false;
          if (!data.success) { textModeToggle.checked = !wanted; return; }
          // Only one conversation can be on at a time.
          messages.forEach(function(x){ x.textMode = (wanted && x.reference === m.reference); });
          textModeNote.style.display = wanted ? 'block' : 'none';
          renderList();
        })
        .catch(function(){
          textModeToggle.disabled = false;
          textModeToggle.checked = !wanted;
        });
    });

    // --- Invoice panel ---
    var toggleInvoiceBtn = document.getElementById('toggleInvoiceBtn');
    var invoicePanel = document.getElementById('invoicePanel');
    var invItemsContainer = document.getElementById('invItemsContainer');
    var addInvItemBtn = document.getElementById('addInvItemBtn');
    var invTotals = document.getElementById('invTotals');
    var invTaxRate = document.getElementById('invTaxRate');
    var removeInvoiceBtn = document.getElementById('removeInvoiceBtn');

    function addInvoiceRow(){
      var row = document.createElement('div');
      row.className = 'inv-item-row';
      row.style.cssText = 'display:grid;grid-template-columns:1fr 50px 80px 80px 24px;gap:8px;margin-bottom:8px;align-items:center;';
      row.innerHTML =
        '<input class="inv-desc" placeholder="Description" style="padding:8px 9px;border:1px solid rgba(27,39,51,0.15);border-radius:6px;font-size:12.5px;font-family:\'Inter\',sans-serif;">' +
        '<input class="inv-qty" type="number" value="1" min="0" style="padding:8px 6px;border:1px solid rgba(27,39,51,0.15);border-radius:6px;font-size:12.5px;font-family:\'Inter\',sans-serif;">' +
        '<input class="inv-price" type="number" step="0.01" placeholder="0.00" style="padding:8px 6px;border:1px solid rgba(27,39,51,0.15);border-radius:6px;font-size:12.5px;font-family:\'Inter\',sans-serif;">' +
        '<span class="inv-amount" style="font-size:12.5px;color:#1B2733;text-align:right;">$0.00</span>' +
        '<button type="button" class="inv-remove-row" style="background:none;border:none;color:rgba(27,39,51,0.4);font-size:15px;cursor:pointer;padding:0;">×</button>';

      row.querySelectorAll('.inv-qty, .inv-price').forEach(function(el){
        el.addEventListener('input', recalcInvoice);
      });
      row.querySelector('.inv-remove-row').addEventListener('click', function(){
        row.remove();
        recalcInvoice();
      });

      invItemsContainer.appendChild(row);
      recalcInvoice();
    }

    function recalcInvoice(){
      var subtotal = 0;
      invItemsContainer.querySelectorAll('.inv-item-row').forEach(function(row){
        var qty = parseFloat(row.querySelector('.inv-qty').value) || 0;
        var price = parseFloat(row.querySelector('.inv-price').value) || 0;
        var amount = qty * price;
        row.querySelector('.inv-amount').textContent = '$' + amount.toFixed(2);
        subtotal += amount;
      });
      var taxRate = parseFloat(invTaxRate.value) || 0;
      var taxAmount = subtotal * (taxRate / 100);
      var total = subtotal + taxAmount;

      invTotals.innerHTML =
        '<div style="display:flex;justify-content:space-between;color:rgba(27,39,51,0.6);margin-bottom:4px;"><span>Subtotal</span><span>$' + subtotal.toFixed(2) + '</span></div>' +
        (taxRate > 0 ? '<div style="display:flex;justify-content:space-between;color:rgba(27,39,51,0.6);margin-bottom:4px;"><span>Tax (' + taxRate + '%)</span><span>$' + taxAmount.toFixed(2) + '</span></div>' : '') +
        '<div style="display:flex;justify-content:space-between;font-weight:600;color:#1B2733;margin-top:6px;"><span>Total</span><span>$' + total.toFixed(2) + '</span></div>';
    }

    var docType = 'invoice';
    var docTypeInvoiceBtn = document.getElementById('docTypeInvoice');
    var docTypeQuoteBtn = document.getElementById('docTypeQuote');
    var quoteNotice = document.getElementById('quoteNotice');
    var invDueDateEl = document.getElementById('invDueDate');
    function setDocType(type){
      docType = type;
      var q = type === 'quote';
      docTypeInvoiceBtn.classList.toggle('active', !q);
      docTypeQuoteBtn.classList.toggle('active', q);
      quoteNotice.style.display = q ? 'block' : 'none';
      invDueDateEl.style.display = q ? 'none' : '';
      removeInvoiceBtn.textContent = q ? 'Remove quote' : 'Remove invoice';
    }
    docTypeInvoiceBtn.addEventListener('click', function(){ setDocType('invoice'); });
    docTypeQuoteBtn.addEventListener('click', function(){ setDocType('quote'); });

    function collectInvoiceData(){
      if (invoicePanel.style.display === 'none') return null;
      var items = [];
      invItemsContainer.querySelectorAll('.inv-item-row').forEach(function(row){
        var description = row.querySelector('.inv-desc').value.trim();
        var qty = parseFloat(row.querySelector('.inv-qty').value) || 0;
        var unitPrice = parseFloat(row.querySelector('.inv-price').value) || 0;
        if (description) items.push({ description: description, qty: qty, unitPrice: unitPrice });
      });
      if (items.length === 0) return null;

      return {
        billToName: document.getElementById('invBillToName').value.trim() || m.name,
        billToAddress: document.getElementById('invBillToAddress').value.trim(),
        orderDescription: document.getElementById('invOrderDesc').value.trim(),
        docType: docType,
        dueDate: docType === 'quote' ? '' : document.getElementById('invDueDate').value.trim(),
        taxRate: parseFloat(invTaxRate.value) || 0,
        items: items
      };
    }

    toggleInvoiceBtn.addEventListener('click', function(){
      var showing = invoicePanel.style.display !== 'none';
      invoicePanel.style.display = showing ? 'none' : 'block';
      toggleInvoiceBtn.style.display = showing ? 'inline-block' : 'none';
      if (!showing && invItemsContainer.children.length === 0) addInvoiceRow();
    });
    removeInvoiceBtn.addEventListener('click', function(){
      invoicePanel.style.display = 'none';
      toggleInvoiceBtn.style.display = 'inline-block';
      invItemsContainer.innerHTML = '';
      setDocType('invoice');
    });
    addInvItemBtn.addEventListener('click', addInvoiceRow);
    invTaxRate.addEventListener('input', recalcInvoice);

    sendBtn.addEventListener('click', function(){
      var text = replyTextEl.value.trim();
      if (!text) return;
      errorLabel.textContent = '';

      // If the invoice/quote panel is open but has no usable line item,
      // stop instead of silently sending the email without the PDF.
      if (invoicePanel.style.display !== 'none' && !collectInvoiceData()){
        errorLabel.textContent = 'Add a line item with a description, or click Remove ' + (docType === 'quote' ? 'quote' : 'invoice') + ' — nothing was sent.';
        return;
      }

      sendBtn.disabled = true;
      sendBtn.textContent = 'Sending…';

      var form = new FormData();
      form.append('reference', m.reference);
      form.append('replyText', text);
      pendingFiles.forEach(function(f){ form.append('attachments', f); });

      var invoiceData = collectInvoiceData();
      if (invoiceData) form.append('invoiceData', JSON.stringify(invoiceData));

      apiFetch('/api/inbox/reply', { method: 'POST', body: form })
        .then(function(r){ return r.json().then(function(data){ return { ok: r.ok, data: data }; }); })
        .then(function(result){
          sendBtn.disabled = false;
          sendBtn.textContent = 'Send Reply';
          if (!result.ok || !result.data.success){
            throw new Error(result.data.error || 'Something went wrong.');
          }
          m.status = 'replied';
          pendingFiles = [];
          // Refetch so the just-sent reply (now saved server-side) shows
          // up in the conversation thread immediately. loadMessages()
          // already re-renders the detail pane for the active message.
          loadMessages(function(){
            var freshSentLabel = document.getElementById('sentLabel');
            if (freshSentLabel){
              freshSentLabel.style.opacity = '1';
              setTimeout(function(){ freshSentLabel.style.opacity = '0'; }, 2500);
            }
          }, true);
        })
        .catch(function(err){
          sendBtn.disabled = false;
          sendBtn.textContent = 'Send Reply';
          errorLabel.textContent = err.message;
        });
    });
  }

  searchBox.addEventListener('input', renderList);

  // Auto-login if a key is already saved this session.
  if (getKey()){
    loadMessages(function(ok){
      if (ok){
        loginScreen.style.display = 'none';
        inboxScreen.style.display = 'block';
      }
    });
  }

  // Poll for new messages every 25s while the inbox is open.
  setInterval(function(){
    if (inboxScreen.style.display === 'block') loadMessages(null, true);
  }, 25000);
</script>
</body>
</html>
