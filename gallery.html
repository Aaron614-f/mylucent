<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gallery — myLucent.co</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Spectral:wght@400;500;600&family=Inter:wght@300;400;500;600&display=swap');
  :root{
    --ivory:#F4F1EA; --white:#FFFFFF; --charcoal:#1B2733;
    --gold:#A9784F; --gold-soft:#C9A97D;
    --line: rgba(27,39,51,0.12); --muted: rgba(27,39,51,0.6);
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; background:var(--ivory); color:var(--charcoal); font-family:'Inter', sans-serif; }
  h1,h2,h3{ font-family:'Spectral', serif; margin:0; }
  a{ color:inherit; }
  img{ max-width:100%; display:block; }

  header{ display:flex; align-items:center; justify-content:space-between; padding:22px 44px; background:var(--charcoal); }
  .brand{ display:flex; align-items:center; }
  .brand-logo{ height:26px; width:94px; display:block; }
  nav{ display:flex; gap:28px; }
  nav a{ font-size:12px; letter-spacing:2px; text-decoration:none; color:var(--ivory); opacity:0.85; }
  nav a:hover{ opacity:1; color:var(--gold-soft); }

  .section-inner{ max-width:1100px; margin:0 auto; padding:70px 44px 90px; }
  @media (max-width: 760px){ .section-inner{ padding:50px 20px 60px; } }
  .intro{ text-align:center; margin-bottom:48px; }
  .eyebrow{ font-size:11px; letter-spacing:3px; color:var(--gold); display:block; margin-bottom:16px; }
  .intro h1{ font-size:34px; font-weight:500; margin-bottom:14px; }
  .intro p{ font-size:14px; color:var(--muted); max-width:520px; margin:0 auto; line-height:1.7; }

  .project-grid{
    display:grid; grid-template-columns:repeat(3, 1fr); gap:26px;
  }
  @media (max-width: 900px){ .project-grid{ grid-template-columns:repeat(2, 1fr); } }
  @media (max-width: 560px){ .project-grid{ grid-template-columns:1fr; } }

  .project-card{
    display:block; text-decoration:none; color:inherit;
    border-radius:16px; overflow:hidden;
    background:var(--white);
    box-shadow: 0 20px 40px -28px rgba(27,39,51,0.28);
    transition: transform .2s ease, box-shadow .2s ease;
  }
  .project-card:hover{ transform:translateY(-4px); box-shadow: 0 28px 52px -26px rgba(27,39,51,0.34); }
  .project-card .thumb{ height:220px; width:100%; object-fit:cover; }
  .project-card .card-body{ padding:18px 20px 22px; }
  .project-card .tag{ font-size:10px; letter-spacing:2px; color:var(--gold); text-transform:uppercase; }
  .project-card h3{ font-size:17px; font-weight:500; margin-top:8px; }

  footer{ padding:40px 44px 28px; text-align:center; border-top:1px solid var(--line); background:var(--white); }
  .footer-inner{ display:flex; justify-content:center; gap:24px; margin-bottom:16px; }
  .footer-inner a{ font-size:11px; letter-spacing:1.5px; text-transform:uppercase; color:var(--charcoal); text-decoration:none; }
  .footer-inner a:hover{ color:var(--gold); }
  footer p{ font-size:11px; letter-spacing:1px; color:var(--muted); margin:0; }
</style>
</head>

<script src="projects-data.js"></script>
<script>
  var grid = document.getElementById('projectGrid');
  (window.PROJECTS || []).forEach(function(p){
    var a = document.createElement('a');
    a.className = 'project-card';
    a.href = 'project.html?id=' + encodeURIComponent(p.id);

    var img = document.createElement('img');
    img.className = 'thumb';
    img.src = p.cover;
    img.alt = p.title;

    var body = document.createElement('div');
    body.className = 'card-body';
    body.innerHTML = '<div class="tag">' + p.tag + '</div><h3>' + p.title + '</h3>';

    a.appendChild(img);
    a.appendChild(body);
    grid.appendChild(a);
  });
</script>
